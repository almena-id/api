name: almena-api

services:
  api:
    build:
      context: .
    image: almena-api:dev
    restart: unless-stopped
    ports:
      - "${REGISTRY_API_PORT:-8000}:8000"
    volumes:
      - ./well-known:/app/well-known:ro
    environment:
      REGISTRY_ENVIRONMENT: ${REGISTRY_ENVIRONMENT:-production}
      REGISTRY_LOG_LEVEL: ${REGISTRY_LOG_LEVEL:-INFO}
      # Always JSON in the container, whatever .env says for task dev.
      REGISTRY_LOG_FORMAT: json
      REGISTRY_PUBLIC_URL: ${REGISTRY_PUBLIC_URL:-https://api.almena.id}
      REGISTRY_DID_URL: ${REGISTRY_DID_URL:-https://almena.id}
      REGISTRY_CORS_ORIGINS: ${REGISTRY_CORS_ORIGINS:-["https://registry.almena.id"]}
      # /.well-known/did.json and did-configuration.json, from ./well-known.
      REGISTRY_WELL_KNOWN_DIR: /app/well-known
      # Docker's networks: trust X-Forwarded-* from a reverse proxy on them.
      REGISTRY_FORWARDED_ALLOW_IPS: ${REGISTRY_FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      REGISTRY_DB_HOST: postgres
      REGISTRY_DB_PORT: 5432
      REGISTRY_DB_NAME: ${REGISTRY_DB_NAME:-registry}
      REGISTRY_DB_USER: ${REGISTRY_DB_USER:-registry}
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD:?set REGISTRY_DB_PASSWORD in .env (task init)}
      REGISTRY_DB_POOL_SIZE: ${REGISTRY_DB_POOL_SIZE:-5}
      REGISTRY_DB_ECHO: ${REGISTRY_DB_ECHO:-false}
      REGISTRY_SESSION_TTL_HOURS: ${REGISTRY_SESSION_TTL_HOURS:-12}
      REGISTRY_SESSION_IDLE_MINUTES: ${REGISTRY_SESSION_IDLE_MINUTES:-30}
      REGISTRY_LOGIN_CODE_TTL_MINUTES: ${REGISTRY_LOGIN_CODE_TTL_MINUTES:-10}
      REGISTRY_LOGIN_CODE_MAX_ATTEMPTS: ${REGISTRY_LOGIN_CODE_MAX_ATTEMPTS:-5}
      # Mailpit below unless a real SMTP server is configured.
      REGISTRY_SMTP_HOST: ${REGISTRY_SMTP_DOCKER_HOST:-mailpit}
      REGISTRY_SMTP_PORT: ${REGISTRY_SMTP_PORT:-1025}
      REGISTRY_SMTP_USERNAME: ${REGISTRY_SMTP_USERNAME:-}
      REGISTRY_SMTP_PASSWORD: ${REGISTRY_SMTP_PASSWORD:-}
      REGISTRY_SMTP_STARTTLS: ${REGISTRY_SMTP_STARTTLS:-false}
      REGISTRY_MAIL_FROM: ${REGISTRY_MAIL_FROM:-Almena Registry <no-reply@almena.id>}
      REGISTRY_PORTAL_URL: ${REGISTRY_PORTAL_URL:-https://registry.almena.id}
      REGISTRY_CATALOG_URL: ${REGISTRY_CATALOG_URL:-https://catalog.almena.id}
      REGISTRY_VAULT_PROVIDER: ${REGISTRY_VAULT_PROVIDER:-openbao}
      # The openbao service below; task up provisions it before the API starts.
      REGISTRY_OPENBAO_ADDR: ${REGISTRY_OPENBAO_DOCKER_ADDR:-http://openbao:8200}
      REGISTRY_OPENBAO_MOUNT: ${REGISTRY_OPENBAO_MOUNT:-almena}
      REGISTRY_OPENBAO_ROLE_ID: ${REGISTRY_OPENBAO_ROLE_ID:-registry-api}
      REGISTRY_OPENBAO_SECRET_ID: ${REGISTRY_OPENBAO_SECRET_ID:?set REGISTRY_OPENBAO_SECRET_ID in .env (task init)}
      REGISTRY_RABBITMQ_API_URL: ${REGISTRY_RABBITMQ_DOCKER_API_URL:-http://rabbitmq:15672}
      REGISTRY_RABBITMQ_ADMIN: ${REGISTRY_RABBITMQ_ADMIN:-almena}
      REGISTRY_RABBITMQ_PASSWORD: ${REGISTRY_RABBITMQ_PASSWORD:?set REGISTRY_RABBITMQ_PASSWORD in .env (task init)}
      REGISTRY_RABBITMQ_VHOST: ${REGISTRY_RABBITMQ_VHOST:-almena}
      REGISTRY_RABBITMQ_AMQP_URL: ${REGISTRY_RABBITMQ_AMQP_URL:-amqps://broker.almena.id:5671}
      REGISTRY_GOOGLE_CLIENT_ID: ${REGISTRY_GOOGLE_CLIENT_ID:-}
      REGISTRY_GOOGLE_CLIENT_SECRET: ${REGISTRY_GOOGLE_CLIENT_SECRET:-}
      REGISTRY_MICROSOFT_CLIENT_ID: ${REGISTRY_MICROSOFT_CLIENT_ID:-}
      REGISTRY_MICROSOFT_CLIENT_SECRET: ${REGISTRY_MICROSOFT_CLIENT_SECRET:-}
      REGISTRY_MICROSOFT_TENANT: ${REGISTRY_MICROSOFT_TENANT:-common}
      REGISTRY_GITHUB_CLIENT_ID: ${REGISTRY_GITHUB_CLIENT_ID:-}
      REGISTRY_GITHUB_CLIENT_SECRET: ${REGISTRY_GITHUB_CLIENT_SECRET:-}
      REGISTRY_APPLE_CLIENT_ID: ${REGISTRY_APPLE_CLIENT_ID:-}
      REGISTRY_APPLE_TEAM_ID: ${REGISTRY_APPLE_TEAM_ID:-}
      REGISTRY_APPLE_KEY_ID: ${REGISTRY_APPLE_KEY_ID:-}
      REGISTRY_APPLE_PRIVATE_KEY: ${REGISTRY_APPLE_PRIVATE_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      openbao:
        condition: service_healthy

  migrate:
    # Brings the schema up to date, then exits; the API waits for it.
    image: almena-api:dev
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment:
      REGISTRY_DB_HOST: postgres
      REGISTRY_DB_PORT: 5432
      REGISTRY_DB_NAME: ${REGISTRY_DB_NAME:-registry}
      REGISTRY_DB_USER: ${REGISTRY_DB_USER:-registry}
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD:?set REGISTRY_DB_PASSWORD in .env (task init)}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REGISTRY_DB_NAME:-registry}
      POSTGRES_USER: ${REGISTRY_DB_USER:-registry}
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASSWORD:?set REGISTRY_DB_PASSWORD in .env (task init)}
    ports:
      # Local access for `task dev` and `task db:shell`; bound to loopback only.
      - "127.0.0.1:${REGISTRY_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<major>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    # Development mail server: catches every email the API sends and shows it
    # at http://localhost:8025 instead of delivering it.
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REGISTRY_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${REGISTRY_MAILPIT_UI_PORT:-8025}:8025"

  openobserve:
    # Indexes the logs: its UI and ingestion API at http://localhost:5080,
    # signing in as REGISTRY_OPENOBSERVE_ADMIN. The image has no shell, so no
    # healthcheck: GET /healthz answers once it is up.
    image: public.ecr.aws/zinclabs/openobserve:v1.0.4
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${REGISTRY_OPENOBSERVE_ADMIN:-admin@almena.id}
      # 8-128 characters with a lowercase and an uppercase letter, a digit and
      # a symbol, or it refuses to start.
      ZO_ROOT_USER_PASSWORD: ${REGISTRY_OPENOBSERVE_PASSWORD:?set REGISTRY_OPENOBSERVE_PASSWORD in .env (task init)}
      ZO_DATA_DIR: /data
      # Entries older than this are deleted (whole files, by the compactor, so
      # some hours late at most).
      ZO_COMPACT_DATA_RETENTION_DAYS: ${REGISTRY_OPENOBSERVE_RETENTION_DAYS:-30}
      ZO_TELEMETRY: "false"
    ports:
      - "127.0.0.1:${REGISTRY_OPENOBSERVE_PORT:-5080}:5080"
    volumes:
      - openobserve-data:/data

  rabbitmq:
    # The tenants' message broker: their applications subscribe over AMQP to
    # the queues the platform publishes to. REGISTRY_RABBITMQ_ADMIN is the
    # platform's own account (it replaces `guest`); tenants get users of their
    # own, limited to their queues. The management UI and HTTP API stay on
    # loopback, at http://localhost:15672.
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    # The node is named after the hostname and keeps its data under that
    # name: a fixed one keeps the data across recreated containers.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${REGISTRY_RABBITMQ_ADMIN:-almena}
      RABBITMQ_DEFAULT_PASS: ${REGISTRY_RABBITMQ_PASSWORD:?set REGISTRY_RABBITMQ_PASSWORD in .env (task init)}
      RABBITMQ_DEFAULT_VHOST: ${REGISTRY_RABBITMQ_VHOST:-almena}
    ports:
      # AMQP, open to the tenants' applications.
      - "${REGISTRY_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${REGISTRY_RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "--quiet", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  openbao:
    # The vault where the platform keeps the keys of the issuers, verifiers
    # and mediators (registry_api.vault's `openbao` provider). A real server on
    # Raft storage, not dev mode: what it holds survives restarts, and it
    # starts sealed. `task openbao` initializes it the first time (one unseal
    # key, kept in .openbao-keys.json with the root token), unseals it and
    # provisions the API's mount and AppRole. The API and UI stay on loopback, at
    # http://localhost:8200/ui.
    image: openbao/openbao:2.7.1
    restart: unless-stopped
    command: ["server", "-config=/etc/openbao/config.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:${REGISTRY_OPENBAO_PORT:-8200}:8200"
    volumes:
      - ./openbao/config.hcl:/etc/openbao/config.hcl:ro
      - openbao-data:/openbao/file
    healthcheck:
      # Healthy once it answers, sealed or not: unsealing is a step of its own.
      # `bao status` exits 0 unsealed, 2 sealed, 1 when it cannot be reached.
      test: ["CMD-SHELL", "bao status > /dev/null; [ $$? -ne 1 ]"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  openobserve-data:
  rabbitmq-data:
  openbao-data:
