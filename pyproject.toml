[project]
name = "registry-api"
version = "0.1.0"
description = "Backend API of the Almena ID registry portal"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "dnspython>=2.8.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pycountry>=26.2.16",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10",
    "scalar-fastapi>=1.9.1",
    "sqlalchemy[asyncio]>=2.1.1",
]

[project.scripts]
registry-api = "registry_api.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
